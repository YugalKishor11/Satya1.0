<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Satya 1.0 - Truth Verification System</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography,forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['Fira Code', 'monospace'],
            },
            colors: {
              navy: {
                950: '#020617', // Deep background
                900: '#0f172a',
                800: '#1e293b',
              },
              brand: {
                orange: '#f97316',
                green: '#10b981',
                blue: '#3b82f6',
                purple: '#8b5cf6',
              }
            },
            animation: {
              'loading-bar': 'loading-bar 1.5s infinite linear',
              'blob': 'blob 7s infinite',
            },
            keyframes: {
              'loading-bar': {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(300%)' },
              },
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #020617; /* Default to dark for loader */
        color: #f8fafc;
        margin: 0;
        overflow-x: hidden;
      }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #020617; }
      ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #334155; }

      /* --- SPLASH SCREEN STYLES --- */
      #loader-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background-color: #02040A; /* Deep Dark Navy */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.8s ease-out, visibility 0.8s ease-out;
        font-family: 'Inter', sans-serif;
      }

      .logo-container {
        position: relative;
        width: 100px;
        height: 100px;
        margin-bottom: 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: float 4s ease-in-out infinite;
      }

      .shield-svg {
        width: 100%;
        height: 100%;
        fill: none;
        stroke: #FF6B00; /* Vibrant Orange */
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 15px rgba(255, 107, 0, 0.4));
        animation: pulse-glow 3s infinite ease-in-out;
      }

      .checkmark-path {
        stroke-dasharray: 24;
        stroke-dashoffset: 24;
        animation: draw-check 1s cubic-bezier(0.65, 0, 0.45, 1) forwards 0.5s;
      }

      .app-title {
        display: flex;
        align-items: baseline;
        gap: 0.5rem;
        margin-bottom: 3rem;
        opacity: 0;
        animation: fade-up 1s ease-out forwards 0.3s;
      }

      .text-satya {
        font-size: 2.5rem;
        font-weight: 800;
        color: #FFFFFF;
        letter-spacing: -0.03em;
      }

      .text-version {
        font-size: 1.5rem;
        font-weight: 400;
        color: #64748B; /* Slate 500 */
      }

      .progress-container {
        width: 240px;
        height: 4px;
        background-color: rgba(255, 255, 255, 0.05);
        border-radius: 99px;
        overflow: hidden;
        position: relative;
        opacity: 0;
        animation: fade-in 1s ease-out forwards 0.6s;
      }

      .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #FF6B00, #ff8c00);
        border-radius: 99px;
        box-shadow: 0 0 20px rgba(255, 107, 0, 0.5);
        animation: progress 2.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      /* Animations */
      @keyframes pulse-glow {
        0%, 100% { filter: drop-shadow(0 0 15px rgba(255, 107, 0, 0.4)); transform: scale(1); opacity: 0.9; }
        50% { filter: drop-shadow(0 0 30px rgba(255, 107, 0, 0.7)); transform: scale(1.05); opacity: 1; }
      }

      @keyframes draw-check {
        to { stroke-dashoffset: 0; }
      }

      @keyframes fade-up {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes fade-in {
        to { opacity: 1; }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }

      @keyframes progress {
        0% { width: 0%; }
        20% { width: 15%; }
        40% { width: 30%; }
        60% { width: 70%; }
        100% { width: 100%; }
      }

      /* Transitions */
      #root {
        opacity: 0;
        transition: opacity 1s ease-in;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.1/",
    "react/": "https://esm.sh/react@^19.2.1/",
    "react": "https://esm.sh/react@^19.2.1",
    "react-markdown": "https://esm.sh/react-markdown@9?deps=react@19.2.1",
    "firebase/app": "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js",
    "firebase/": "https://esm.sh/firebase@^12.6.0/",
    "jspdf": "https://esm.sh/jspdf@2.5.1"
  }
}
</script>
</head>
  <body>
    <!-- LOADING SCREEN START -->
    <div id="loader-overlay">
      <div class="logo-container">
         <svg class="shield-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 22C12 22 20 18 20 12V5L12 2L4 5V12C4 18 12 22 12 22Z" />
            <path class="checkmark-path" stroke="#02040A" stroke-width="2.5" d="M8 12L11 15L16 9" />
         </svg>
      </div>
      <div class="app-title">
        <span class="text-satya">Satya</span><span class="text-version">1.0</span>
      </div>
      <div class="progress-container">
        <div class="progress-bar"></div>
      </div>
    </div>
    <!-- LOADING SCREEN END -->

    <div id="root"></div>

    <script>
      // Logic for Loading Screen
      window.addEventListener('load', () => {
        const minLoadTime = 2500; // 2.5 Seconds
        const loader = document.getElementById('loader-overlay');
        const root = document.getElementById('root');
        
        setTimeout(() => {
          // Fade out loader
          loader.style.opacity = '0';
          loader.style.visibility = 'hidden';
          
          // Fade in content
          root.style.opacity = '1';

          // Clean up DOM after transition
          setTimeout(() => {
            loader.style.display = 'none';
          }, 800);
        }, minLoadTime);
      });
    </script>
  </body>
</html>
